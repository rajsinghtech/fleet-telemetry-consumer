<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Gotham Medium", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fff;
            color: #171a20;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            font-size: 40px;
            font-weight: 500;
            margin-bottom: 30px;
        }
        .tesla-button {
            background-color: #3e6ae1;
            color: #fff;
            border: none;
            padding: 16px 48px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 10px;
            min-width: 264px;
            backdrop-filter: blur(8px);
            box-shadow: inset 0 0 0 2px transparent;
        }
        .tesla-button:hover {
            background-color: #3457b1;
        }
        .tesla-button.secondary {
            background-color: rgba(244, 244, 244, 0.65);
            color: #393c41;
            box-shadow: inset 0 0 0 2px #393c41;
        }
        .tesla-button.secondary:hover {
            background-color: #393c41;
            color: #fff;
        }
        .description {
            max-width: 600px;
            margin: 0 auto 40px;
            font-size: 16px;
            line-height: 1.5;
            color: #393c41;
        }
        .response-display {
            margin-top: 20px;
            padding: 20px;
            background-color: rgba(244, 244, 244, 0.65);
            border-radius: 20px;
            display: none;
            text-align: left;
            word-break: break-all;
            backdrop-filter: blur(8px);
        }
        .response-display h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #171a20;
        }
        .response-display pre {
            margin: 0;
            white-space: pre-wrap;
            background-color: #fff;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #ddd;
        }
        .response-section {
            margin-bottom: 20px;
        }
        .error-message {
            color: #d32f2f;
            margin-top: 10px;
            display: none;
            padding: 15px;
            background-color: rgba(255, 235, 238, 0.9);
            border-radius: 20px;
            backdrop-filter: blur(8px);
        }
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tesla Fleet Telemetry Operator</h1>
        <p class="description">
            Injest the telemetry data from your Tesla fleet into your data warehouse.
        </p>
        <div class="button-container">
            <button class="tesla-button" onclick="generateToken()">
                Generate Partner Token & Register
            </button>
            <button class="tesla-button secondary" onclick="window.location.href='/.well-known/appspecific/com.tesla.3p.public-key.pem'">
                Download Public Key
            </button>
        </div>
        <div id="responseDisplay" class="response-display">
            <div class="response-section">
                <h3>Partner Authentication Token:</h3>
                <pre id="tokenContent"></pre>
            </div>
            <div class="response-section">
                <h3>Registration Response:</h3>
                <pre id="registrationContent"></pre>
            </div>
        </div>
        <div id="errorMessage" class="error-message"></div>
    </div>

    <script>
        async function generateToken() {
            const responseDisplay = document.getElementById('responseDisplay');
            const tokenContent = document.getElementById('tokenContent');
            const registrationContent = document.getElementById('registrationContent');
            const errorMessage = document.getElementById('errorMessage');
            
            try {
                const response = await fetch('/generate-token', {
                    method: 'POST',
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to generate token and register');
                }
                
                const data = await response.json();
                tokenContent.textContent = JSON.stringify(data.token, null, 2);
                registrationContent.textContent = JSON.stringify(data.registration, null, 2);
                responseDisplay.style.display = 'block';
                errorMessage.style.display = 'none';
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';
                responseDisplay.style.display = 'none';
            }
        }
    </script>
</body>
</html>
