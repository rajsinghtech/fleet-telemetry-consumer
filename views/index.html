<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fff;
            color: #171a20;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            font-size: 40px;
            font-weight: 500;
            margin-bottom: 30px;
        }
        .tesla-button {
            background-color: #171a20;
            color: #fff;
            border: none;
            padding: 12px 40px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tesla-button:hover {
            background-color: #444;
        }
        .description {
            max-width: 600px;
            margin: 0 auto 40px;
            font-size: 16px;
            line-height: 1.5;
            color: #393c41;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tesla Fleet Telemetry Operator</h1>
        <p class="description">
            Injest the telemetry data from your Tesla fleet into your data warehouse.
        </p>
        <button class="tesla-button" onclick="window.location.href='/.well-known/appspecific/com.tesla.3p.public-key.pem'">
            Download Public Key
        </button>
    </div>
</body>
</html>
