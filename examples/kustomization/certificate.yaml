apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tesla-raj-tls
spec:
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - fleet-telemetry.tesla.rajsingh.info
    - tesla.rajsingh.info
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: raj-issuer
  secretName: tesla-raj-tls
  usages:
    - digital signature
    - key encipherment